name: Daily FII Depository Sync

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 6:30 PM IST (After market close)
    - cron: "0 16 * * 1-5"   # 9:30 PM IST (Evening custodian sync)
    - cron: "0 4 * * 1-5"    # 9:30 AM IST (Morning T+1 refresh)
  workflow_dispatch:         # Lets you trigger a run manually with 1 click

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas lxml html5lib requests
      - run: python scripts/scraper.py
      - name: Save updated JSON to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fii_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily FII data" && git push)
